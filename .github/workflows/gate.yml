# 게이트 + 배포 — push·PR 마다 빌드하고 검사하며, main push 일 때만 _site/ 를 Pages 에 배포한다.
#
# ▣ 261121 전환: «main 브랜치 그대로 서빙» → «Actions 가 만든 _site/ 만 배포»
#   종전 GitHub Pages(legacy, main 브랜치 /) 는 저장소의 모든 파일을 URL 로 내보냈다.
#   www.jttax.co.kr/project/src/*.jsx(계산기 화면 원본)·/project/dev/(계산 계약·출시 점검)·
#   /project/tests_*.js 가 모두 200 이었다(261121 실측). 이제는 npm run site 가 허용 목록으로
#   만든 _site/ 만 올라간다. 허용 규칙·금지 검사 = project/scripts/build_site.mjs.
#
# ▣ 바뀐 점 (작업하는 세션이 알아야 할 것)
#   · main 에 push 하면 «게이트 통과 뒤에» 배포된다. 게이트가 빨간불이면 라이브는 바뀌지 않는다.
#     (종전에는 Pages 가 먼저 서빙하고 게이트가 뒤늦게 빨간불이 됐다.)
#   · 새 파일 유형(예: 새 폴더의 페이지, 새 확장자 자산)을 추가했으면 build_site.mjs 허용 규칙에 넣는다.
#     빠뜨리면 site 단계가 «참조하는데 _site 에 없음» 으로 실패해 배포가 멈춘다.
#
# ▣ 저장소 설정 전제: Settings → Pages → Source = «GitHub Actions» (build_type=workflow).
#   «Deploy from a branch» 상태에서는 그 브랜치 전체가 계속 서빙된다(이 워크플로의 deploy 결과와 무관).
#
# ▣ 첫 전환 순서 — deploy 잡의 성공·실패를 전제하지 않는다 (소스 전환 시 기존 게시본 유지 여부는 공식 문서에 없다)
#   1) 이 워크플로를 main 에 반영 → gate·site 통과 확인 (deploy 잡 결과는 보지 않는다)
#   2) gh api -X PUT repos/<소유자>/jttax/pages -f build_type=workflow   (cname 유지 확인: GET …/pages)
#   3) gh workflow run gate.yml --ref main  (수동 실행 = 새 실행에서 gate → site → deploy 전부)
#   4) 라이브 확인: /project/src/ReportAcquisition.jsx·/project/dev/…·/project/tests_acq_check.js = 404,
#      sitemap 페이지·계산기 = 200
#
# ▣ 되돌리기 — ⛔ Source 를 «Deploy from a branch» 로 되돌리지 않는다.
#   그러면 저장소 원본·시험·개발 자료가 다시 전부 공개된다(이번 전환이 막으려는 바로 그것).
#   · 잘못된 배포를 되돌릴 때: 문제 커밋을 git revert 해서 main 에 push (gate → 재배포) — 기본.
#     급하면 Actions 에서 직전 성공 실행을 «Re-run all jobs» (그 커밋으로 _site 를 다시 만들어 배포).
#     artifact 이름에 실행 번호·회차를 붙이므로 재실행해도 이름이 겹치지 않는다(deploy-pages 는 같은
#     이름이 둘이면 실패한다). 다음 main push 가 오면 그 커밋이 다시 배포된다.
#   · Actions 자체가 장애일 때: 기다린다. 브랜치 서빙 복귀는 오너가 노출을 감수한다고 결정한 경우만.
#
# 종전 기록 (260808·260810): tests_build_fresh.js 는 «커밋된 산출물 = 소스로 재생성한 것» 을
#   CI 에서만 실패로 처리한다. 그래서 이 워크플로가 있어야 그 분기가 실제로 돈다.
name: gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 배포는 한 번에 하나만. 진행 중인 배포는 끊지 않는다(반쯤 올라간 상태를 피한다).
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # ci(=clean install) — package-lock.json 을 그대로 재현한다.
      - run: npm ci

      - name: Verify committed asset versions before rebuilding
        run: node project/tests_asset_versions.js

      # CI=true 는 신선도 게이트의 fail-closed 분기 조건이다. 의도를 명시해 둔다.
      - name: npm run gate
        run: npm run gate
        env:
          CI: 'true'

      - name: 변경 잔여 확인
        if: always()
        run: git diff --name-only --ignore-cr-at-eol || true

      # 배포본 생성 + 금지 파일·참조 누락 검사. PR 에서도 돌려서 허용 목록 누락을 미리 잡는다.
      - name: npm run site
        run: npm run site

      # 실행마다·재실행 회차마다 다른 이름. deploy 잡은 이 출력을 받아 쓴다 — «실패한 잡만 재실행»하면
      # gate 는 다시 돌지 않고 앞 회차 출력(이름)이 그대로 넘어가므로 그 artifact 를 배포한다.
      - name: Pages artifact 이름
        id: artifact
        run: echo "name=github-pages-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: _site/

  deploy:
    needs: gate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.gate.outputs.artifact }}
