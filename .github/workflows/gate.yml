# 게이트 — push·PR 마다 빌드하고 검사한다.
#
# ⚠️ 배포는 건드리지 않는다. GitHub Pages 의 기존 배포 방식(main 브랜치 서빙)은 그대로다.
#    이 워크플로는 «검사만» 한다 — 실패해도 배포가 막히지는 않으므로, 빨간불이 뜨면
#    사람이 보고 되돌린다. (배포 차단까지 하려면 Pages 를 Actions 배포로 바꿔야 하는데,
#    그건 배포 경로 자체를 바꾸는 일이라 별도 결정 사항이다.)
#
# 왜 지금 만드나 (260808 Codex P2a R3 P1):
#   project/tests_build_fresh.js 는 «커밋된 산출물이 소스로 재생성한 것과 같은가»를
#   CI 에서만 실패로 처리한다(로컬은 개발 중이라 경고). 그런데 CI 가 없으면 그 분기는
#   영영 실행되지 않는 죽은 코드이고, 「원고만 고치고 빌드를 잊은 커밋」이 그대로 라이브에
#   올라간다. GitHub Pages 는 커밋된 파일을 그대로 서빙한다.
name: gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # devDependencies 는 @babel/parser 하나뿐이라 가볍다.
      # ci(=clean install) 를 쓰는 이유: package-lock.json 을 그대로 재현해야
      # 「내 컴퓨터에선 됐는데」를 막는다.
      - run: npm ci

      # CI=true 는 GitHub Actions 가 자동으로 넣지만, 신선도 게이트의 fail-closed 분기가
      # 이 값에 걸려 있으므로 «의도»를 눈에 보이게 명시해 둔다.
      - name: npm run gate
        run: npm run gate
        env:
          CI: 'true'

      # 게이트가 통과해도 워킹트리가 더러우면(빌드 산출물 미커밋) 위에서 이미 실패한다.
      # 여기서는 CRLF 무시 기준으로 한 번 더 눈에 보이게 남긴다 — 실패 시 원인 파악용.
      - name: 변경 잔여 확인
        if: always()
        run: git diff --name-only --ignore-cr-at-eol || true
