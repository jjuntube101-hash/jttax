<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JT 출시 후보 실무 검증</title><link rel="stylesheet" href="../src/styles.css?v=33"><style>body{margin:0}header.qa{padding:20px;background:#f3f6f5;border-bottom:1px solid #ccd6d0}header.qa p{max-width:1000px}header.qa button{padding:10px;margin:4px;font:inherit}#candidate-status{white-space:pre-wrap;overflow-wrap:anywhere}#root{display:none}</style><header class="qa"><h1>실무 입력부터 결과까지</h1><p>개발 검증 전용 · 합성 사실만 입력하세요. 실제 제품 입력 화면과 로컬 계산 엔진을 사용합니다. AI 해설은 고정 문구이며 고객 저장·외부 전송을 차단합니다.</p><nav aria-label="검증 업무"><button data-workflow="gift">증여 재산명세</button><button data-workflow="stock">주식 보충평가</button><button data-workflow="acquisition">특수 취득</button><button data-workflow="annual">비사업용 연간 토지</button><button data-workflow="credit">외국납부 공제</button><button data-workflow="transfer">양도 경비 갈래</button></nav><p id="candidate-status" role="status">출시 후보 정보를 확인 중입니다.</p><a href="release-readiness.html">전체 사례 지도</a></header><div id="root"></div><div id="workflows-root"></div><script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script><script>
window.JT_ENGINE_BASE='http://127.0.0.1:19421';window.__qa_requests=[];window.__qa_ai_prompts=[];window.__qa_case='manual';
window.claude={complete:async prompt=>{window.__qa_ai_prompts.push(prompt);return JSON.stringify({headline:'개발 검증용 고정 해설',cautions:[],saving_ideas:[],followup:[]});}};
const qaFetch=window.fetch;window.fetch=async(url,options)=>{const u=new URL(typeof url==='string'?url:url.url,location.href);if(!(u.origin===location.origin&&(!options||!options.method||options.method==='GET'))&&!(u.origin===window.JT_ENGINE_BASE&&(/^\/v1\/calc\//.test(u.pathname)||['/health','/v1/calculation-contracts'].includes(u.pathname))))throw Error('검증 화면은 계산·정체성 확인만 허용합니다.');const init={...options};if(init.method==='POST')init.headers={...init.headers,'x-qa-case':window.__qa_case};const r=await qaFetch(url,init);if(init.method==='POST'){const copy=await r.clone().json();window.__qa_requests.push({case:window.__qa_case,path:u.pathname,input:JSON.parse(init.body),status:r.status,response:copy});}return r;};
</script><script src="../dist/app.js?v=137"></script><script>
const uiRoot=ReactDOM.createRoot(document.getElementById('workflows-root'));
const workflows={gift:window.JTSupportReviewDirect,stock:window.JTSupportReviewDirect,acquisition:window.JTSupportReviewDirect,annual:window.JTSupportReviewDirect,credit:window.JTCreditSettlementDirect,transfer:window.JTReportCGT};let sequence=0;
function openWorkflow(key){uiRoot.render(React.createElement(workflows[key],{key:++sequence,initialMode:key,onBack:()=>{},setRoute:()=>{}}));}
document.querySelectorAll('[data-workflow]').forEach(button=>button.onclick=()=>openWorkflow(button.dataset.workflow));
async function verifyCandidate(){try{const [engine,record]=await Promise.all([fetch(window.JT_ENGINE_BASE+'/v1/calculation-contracts').then(r=>r.json()),fetch('./release-readiness.json').then(r=>r.json())]);const c=record.release_candidate;const frontend=window.JT_FRONTEND_BUILD;const same=!!frontend&&frontend.payload_sha256===c.frontend.payload_sha256&&['build_sha256','ruleset_sha256'].every(k=>engine.version[k]===c.contract.version[k])&&c.contract.taxes.every(t=>engine.taxes.find(x=>x.tax===t.tax)?.request_schema_sha256===t.request_schema_sha256);window.__qa_contract=engine;window.__qa_candidate={id:c.id,matched:same,frontend,backend:engine.version};document.title='JT 출시 후보 실무 검증';document.getElementById('candidate-status').textContent=same?'출시 후보 '+c.id+' · 엔진·9세목 계약·실행 프런트 일치':'불일치 · 이 화면을 현재 후보의 검증 결과로 사용하지 마세요.';document.getElementById('workflows-root').hidden=!same;document.querySelectorAll('[data-workflow]').forEach(b=>b.disabled=!same);}catch(e){document.getElementById('candidate-status').textContent='연결 확인 필요: '+e.message;document.getElementById('workflows-root').hidden=true;}}
verifyCandidate();
openWorkflow('gift');
</script></html>
